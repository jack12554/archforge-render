name: Render ArchForge animation

on:
  workflow_dispatch:
    inputs:
      fps:
        description: "Frames per second"
        default: "24"
      width:
        description: "Width in px"
        default: "1280"
      height:
        description: "Height in px"
        default: "720"
      start:
        description: "Start second"
        default: "0"
      end:
        description: "End second (empty = full)"
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find project file
        run: |
          P=$(find . -type f \( -name '*archf*.json' -o -name 'project.json' \) -not -path './node_modules/*' | head -1)
          echo "Project file: $P"
          test -n "$P"
          echo "PROJECT_FILE=$P" >> "$GITHUB_ENV"

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render frames and encode
        run: PROJECT="$PROJECT_FILE" node render.mjs
        env:
          FPS: ${{ inputs.fps }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          APP_URL: https://3d4j.netlify.app

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: animation
          path: out/*.mp4
